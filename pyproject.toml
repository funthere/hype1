[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: Unit tests without external I/O",
    "integration: Deterministic integration tests (SQLite and scripted adapters)",
    "contract: Exchange gateway contract tests",
    "external: Protected manual testnet smoke tests",
    "slow: Slow running tests"
]

[tool.ruff.format]
# Explicitly pin formatting defaults so CI and local produce identical output.
line-ending = "lf"

[tool.ruff.lint]
# Enforce syntax, undefined-name, and import correctness while legacy style
# cleanup is completed incrementally in focused modules.
# TID251 bans Hyperliquid SDK imports outside src/exchange adapters.
select = ["E4", "E7", "E9", "F", "TID251"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"hyperliquid".msg = "Import the Hyperliquid SDK only inside src/exchange adapters; depend on the execution gateway protocols instead."

[tool.ruff.lint.per-file-ignores]
# The exchange adapter layer is the single place allowed to import the SDK.
"src/exchange/*" = ["TID251"]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:"
]
