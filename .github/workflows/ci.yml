name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      smoke_live:
        description: "Set to true to place real (testnet) smoke orders"
        type: choice
        options: ["false", "true"]
        default: "false"
      smoke_coin:
        description: "Testnet coin to exercise"
        default: "PURR"
      smoke_notional:
        description: "Taker order notional in USD"
        default: "11"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Verify dependency manifests
        run: |
          test -f requirements.in
          test -f requirements.lock
          grep -q "pip-compile" requirements.lock
      - name: Lint
        run: ruff check src/ tests/ run_*.py bot_api_server.py hype_dashboard.py
      - name: Format check
        run: ruff format --check src/ tests/ run_*.py bot_api_server.py hype_dashboard.py
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Run deterministic test suites
        run: >-
          python -m pytest tests/ -m "not external" -v
          --cov=src --cov-branch --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: error

  testnet-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: protected-testnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Smoke self-test (scripted gateway, no network)
        run: python scripts/testnet_smoke.py --mode self-test
      - name: Live testnet lifecycle smoke
        if: inputs.smoke_live == 'true'
        env:
          USE_TESTNET: true
          PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          ADDRESS: ${{ secrets.TESTNET_ADDRESS }}
        run: |
          python scripts/testnet_smoke.py --mode live \
            --coin "${{ inputs.smoke_coin || 'PURR' }}" \
            --notional "${{ inputs.smoke_notional || '11' }}" \
            --i-understand
      - name: Release-gate note
        run: |
          echo "A passing live smoke completes the execution-lifecycle item of"
          echo "the release checklist. Mainnet execution remains source-gated"
          echo "until the full checklist is approved (src/core/safety.py)."
